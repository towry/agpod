[workspace]
members = [
    "crates/agpod-core",
    "crates/agpod-diff",
    "crates/agpod-vcs-path",
    "crates/agpod",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Development Team"]
license = "MIT"
repository = "https://github.com/towry/agpod"

[workspace.dependencies]
# Workspace crates
agpod-core = { path = "crates/agpod-core" }
agpod-diff = { path = "crates/agpod-diff" }
agpod-vcs-path = { path = "crates/agpod-vcs-path" }
# External dependencies
regex = "1.11"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
chrono = "0.4"
anyhow = "1.0"
tempfile = "3.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
git2 = { version = "0.19", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
